name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_name:
        description: Optional release name
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
          cache-dependency-path: agents/device-client/go.sum

      - name: Build Go binaries
        env:
          OUTPUT_DIR: ${{ github.workspace }}/dist/go
        run: scripts/build-go.sh

      - name: Package release artifacts
        run: |
          set -euo pipefail
          mkdir -p dist/release

          for target_dir in dist/go/*; do
            target="$(basename "$target_dir")"
            if [[ "$target" == windows-* ]]; then
              (cd "$target_dir" && zip -r "../../release/keyward-${target}.zip" .)
            else
              tar -C "$target_dir" -czf "dist/release/keyward-${target}.tar.gz" .
            fi
          done

          tar \
            --exclude='platform/venv' \
            --exclude='platform/instance' \
            --exclude='platform/*.db' \
            --exclude='platform/build' \
            --exclude='platform/*.egg-info' \
            -czf dist/release/keyward-platform-source.tar.gz \
            platform README.md deploy proto

          (cd dist/release && sha256sum * > SHA256SUMS)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keyward-release
          path: dist/release/
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.event.inputs.release_name || github.ref_name }}
          generate_release_notes: true
          files: dist/release/*
