[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keyward-platform"
version = "0.1.0"
description = "Management and certificate issuance API for Keyward"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4.0",
  "Flask-SQLAlchemy>=3.1,<4.0",
  "Flask-Migrate>=4.0,<5.0",
  "cryptography>=42.0,<51.0",
  "psycopg[binary]>=3.1,<4.0",
  "pydantic>=2.7,<3.0",
  "python-dotenv>=1.0,<2.0",
  "Authlib>=1.3,<2.0",
  "python3-saml>=1.16,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "ruff>=0.4,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["instance*"]
