{% extends "layout.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--c-blue)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:32px;height:32px;"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
  </div>
  <h1 class="auth-title">Create Account</h1>
  <p class="auth-sub">Set up a local account for SSH access management.</p>

  <form method="post">
    <div class="form-group">
      <label class="form-label">Work Email</label>
      <input class="form-input" type="email" name="email" required autofocus placeholder="you@company.com">
    </div>
    <div class="form-group">
      <label class="form-label">Display Name</label>
      <input class="form-input" name="display_name" placeholder="Jane Smith">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-input" type="password" name="password" minlength="12" required placeholder="At least 12 characters">
    </div>
    <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;margin-top:4px;">Create Account</button>
  </form>

  <div style="text-align:center;margin-top:16px;font-size:13px;">
    <a href="{{ url_for('auth.login') }}" style="color:var(--c-blue);text-decoration:none;">Back to sign in</a>
  </div>
</div>
{% endblock %}
