{% extends "layout.html" %}
{% block title %}Sign In{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--c-blue)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:32px;height:32px;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
  </div>
  <h1 class="auth-title">SSH Access Platform</h1>
  <p class="auth-sub">Sign in with your work email to manage SSH access and devices.</p>

  <form method="post">
    <div class="form-group">
      <label class="form-label">Work Email</label>
      <input class="form-input" type="email" name="email" required autofocus placeholder="you@company.com">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-input" type="password" name="password" required placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
    </div>
    <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;margin-top:4px;">Sign in</button>
  </form>

  <div style="text-align:center;margin-top:16px;font-size:13px;">
    <a href="{{ url_for('auth.register') }}" style="color:var(--c-blue);text-decoration:none;">Create local account</a>
  </div>

  {% if config.DEV_AUTH_ENABLED %}
  <div style="border-top:1px solid var(--c-border);margin-top:20px;padding-top:20px;">
    <div class="cell-s" style="text-transform:uppercase;letter-spacing:.08em;text-align:center;margin-bottom:12px;">Development Login</div>
    <form method="post" action="{{ url_for('auth.dev_login_post') }}">
      <div class="form-group">
        <input class="form-input" type="email" name="email" placeholder="dev@localhost">
      </div>
      <div class="form-group">
        <input class="form-input" name="display_name" placeholder="Display name">
      </div>
      <button class="btn btn-ghost" type="submit" style="width:100%;justify-content:center;color:var(--c-amber);border-color:rgba(245,158,11,.3);">Dev Login</button>
    </form>
  </div>
  {% endif %}
</div>
{% endblock %}
